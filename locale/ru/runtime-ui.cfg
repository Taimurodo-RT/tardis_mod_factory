circuit-codes=Коды: 1 Наувис · 2 Вулкан · 3 Фульгора · 4 Глеба · 5 Аквило · 6 Разрушенная планета. Координаты — в клетках. Доступность исследований, ремонт, заряд и безопасная посадка проверяются при каждом прыжке.
circuit-notes=Выход также передаёт все предметы склада с их количеством и качеством. Постоянный высокий сигнал прыжка не вызывает повторных полётов; для новой команды опустите его до нуля. Внутренний вход имеет приоритет при одновременных командах.
heading-rooms=АРХИТЕКТУРНАЯ СИСТЕМА
rooms-intro-legacy=Сохранено прежнее восточное крыло: перенос комнат не выполнен, чтобы сохранить существующие постройки. Вход через грузовой отсек. Материалы обычного качества берутся из общего склада; формирование — 10 секунд.
rooms-intro=Комнаты растут к северу от круглого консольного зала. Сначала постройте отсек первого уровня, затем его ответвления. Материалы обычного качества берутся из общего склада; формирование — 10 секунд.
