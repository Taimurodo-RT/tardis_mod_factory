[entity-description]
tardis-eye-machine=Узел съёма энергии Ока Гармонии. Щёлкните, чтобы выбрать его в пульте. Для ремонта подойдите не дальше 6 клеток; материалы обычного качества берутся из общего склада.
tardis-eye-hatch=Спуск в нижний зал Ока Гармонии. Подойдите к люку не дальше 4 клеток и щёлкните по нему.
tardis-eye-ladder=Подъём в центральный консольный зал. Подойдите к лестнице не дальше 4 клеток и щёлкните по ней.
tardis-eye-star=Удерживаемая звезда в сердце ТАРДИС. Четыре окружающие энергомашины восстанавливаются отдельно; максимальная отдача в общий резерв — 50 МВт.
