[entity-name]
tardis-circuit-input=ТАРДИС: командный разъём
tardis-circuit-output=ТАРДИС: телеметрия и груз

[entity-description]
tardis-circuit-input=Янтарный разъём. Подключите красный или зелёный провод от своих комбинаторов. Читает команды, ничего не выдаёт. Сигнал J запускает один прыжок при переходе с нуля на положительное значение. P — код планеты, X/Y — координаты.
tardis-circuit-output=Голубой разъём. Выдаёт заряд, состояние, результат команды и содержимое общего склада с учётом качества. Отдельная сеть для безопасной автоматизации. Разъёмы внутри сохраняют проводку при перелёте; внешние остаются подключёнными только до следующего прыжка.

[item-group-name]
tardis-circuit-signals=Логическая сеть ТАРДИС

[virtual-signal-name]
tardis-signal-jump=ТАРДИС J: команда прыжка
tardis-signal-destination=ТАРДИС P: планета назначения
