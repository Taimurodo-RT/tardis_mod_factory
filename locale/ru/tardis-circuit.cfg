tardis-signal-y=ТАРДИС Y: координата посадки
tardis-signal-inhibit=ТАРДИС H: запрет полёта
tardis-signal-export=ТАРДИС G: выдача энергии
tardis-signal-energy=ТАРДИС E: энергия, МДж
tardis-signal-charge=ТАРДИС Q: заряд, %
tardis-signal-busy=ТАРДИС B: корабль в полёте
tardis-signal-ready=ТАРДИС R: базовая готовность
tardis-signal-origin=ТАРДИС O: текущая планета
tardis-signal-items=ТАРДИС I: предметов на складе
tardis-signal-free-slots=ТАРДИС F: свободных ячеек
tardis-signal-result=ТАРДИС C: результат команды

[virtual-signal-description]
tardis-signal-jump=Переход 0→положительное значение запускает один прыжок. Удерживайте сигнал минимум 0,5 секунды. Перед следующей попыткой сбросьте его в 0 минимум на 0,5 секунды. Ошибочная команда не повторяется сама.
tardis-signal-destination=1 — Наувис, 2 — Вулкан, 3 — Фульгора, 4 — Глеба, 5 — Аквило, 6 — Разрушенная планета. Исследования и ремонт обязательны.
tardis-signal-x=Координата X посадки. По умолчанию 0. ТАРДИС ищет безопасную площадку рядом.
tardis-signal-y=Координата Y посадки. По умолчанию 0. ТАРДИС ищет безопасную площадку рядом.
tardis-signal-inhibit=Положительное значение блокирует новый полёт. Не прерывает уже начатый перелёт.
tardis-signal-export=Положительное значение включает выдачу энергии во внешнюю сеть, отрицательное выключает. Ноль оставляет последнее выбранное состояние и возвращает управление интерфейсу. При конфликте приоритет у внутреннего разъёма.
tardis-signal-energy=Доступный общий запас энергии, округлённый вниз до МДж.
tardis-signal-charge=Доля заряда от максимальной ёмкости, 0–100.
tardis-signal-busy=1 во время дематериализации и полёта, иначе 0.
tardis-signal-ready=1, если корабль стоит, Око и консоль восстановлены, нет запрета полёта и есть базовый запас энергии. Для конкретной дальности энергии может потребоваться больше.
tardis-signal-origin=Код текущей планеты по таблице P. 0, если поверхность не входит в штатную карту.
tardis-signal-items=Суммарное количество предметов в общем складе. Сами предметы также передаются отдельными сигналами с качеством.
tardis-signal-free-slots=Число полностью пустых ячеек общего склада. Место в частично заполненных стопках сюда не входит.
tardis-signal-result=Последняя команда: 0 — ещё не было; 1 — прыжок принят; -1 — отказ ремонта/энергии/посадки; -2 — неизвестная или неизученная планета; -3 — уже в полёте; -4 — запрет логической сети.
