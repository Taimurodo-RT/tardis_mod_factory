layout-guide-legacy=На юге круглого зала — большая синяя дверь выхода. Сохранено прежнее восточное крыло: комнаты за грузовым отсеком. Люк возле консоли ведёт вниз, в зал звезды Ока Гармонии.
layout-guide=На юге круглого зала — большая синяя дверь выхода. Северный проход ведёт к ветвям комнат; восточный — к грузовому отсеку. Люк возле консоли ведёт на нижний уровень Ока Гармонии.
