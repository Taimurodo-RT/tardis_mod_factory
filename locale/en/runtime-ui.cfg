help-routes=New routes appear once planets are researched. Distance is measured from the current landing site; 100 MJ per launch plus 1 kJ per kilometre.
help-routes-brief=Follow the worlds you have discovered. Cost: 100 MJ + 1 kJ/km.
help-cargo-filter=Choose an item for an exact filter by quality. Click: take a stack; Shift: take everything available. Items can only be transferred inside the TARDIS.
help-cargo-filter-brief=Click: a stack. Shift: everything. The filter respects quality.
help-cargo-contents=Equipment, quality, tags and spoilage are preserved. Warehouse rooms add 4096 slots each, up to 32 768. Construction materials are taken from here.
help-cargo-contents-brief=Stack contents are preserved. Warehouse module: +4096 slots.
help-reserve=The shared reserve holds 10 GJ. The containment circuit unlocks collector repairs: each collector gives 20 MW, and the converter adds 10 MW once both are fixed. Flight requires all four energy machines in working order.
help-reserve-brief=One reserve for the whole ship. Eye output: 0 → 20 → 40 → 50 MW.
help-power-socket=Connect your factory to the power socket next to the police box. Output follows actual consumption: connecting an empty network does not drain the reserve. The socket travels with the TARDIS.
help-power-socket-brief=Sockets deliver power according to actual load.
help-overload=When the load exceeds generation, the reserve drains. If there is not enough energy for the chosen route, the TARDIS will not take off. Switch off network output or reduce the factory load and wait for it to charge.
help-overload-brief=Overdraw depletes the reserve. A flight needs enough charge for the whole route.
help-port-placement=Outside, place an input/output port no more than 8 tiles from the police box; these ports stay on the planet. Inside, ports work in every room and during flight, supplying the mobile factory from the shared warehouse.
help-port-placement-brief=External ports: up to 8 tiles from the box. Internal ports: on both decks.
help-port-filters=An input without a filter accepts any items. An output without a filter delivers nothing. "Keep" is the minimum stock of the chosen item held back in the warehouse. Up to 500 items per cycle, two cycles per second.
help-port-filters-brief=Inputs accept everything. Outputs need a filter. "Keep" protects your stock.
help-port-logistics=The input is a logistic requester chest, the output is a passive provider. Robot requests are set in the usual chest window; inserters work as normal.
help-port-logistics-brief=Robots and inserters service the ports like ordinary chests.
help-circuit=Separate input and output terminals sit on the sides of the police box and in the cargo hold. Send commands to the input and read the status from the output; do not join them with a single wire. Cargo ports connect items to the shared factory; signal terminals control the ship.
help-circuit-brief=The amber terminal takes commands. The blue one reports status.
help-restoration=In the crash, the engineer's ship slammed into the TARDIS. Repair the systems in order, supplying the shared warehouse through cargo ports or by hand. Normal-quality materials are used.
help-restoration-brief=The crash is still etched into the ship's memory. Restore the damaged systems.
help-eye-order=First the containment circuit, then the two collectors in any order, and the converter last. Requires a working control matrix and chemical science. Partial output charges the reserve, but all four machines must work for flight.
help-eye-order-brief=Containment → two collectors → converter. Repair next to the machine.
help-room-supply=Input cargo ports also supply construction. A room can be cancelled while it is forming; finished rooms remain part of the ship.
help-room-supply-brief=Materials come from the shared warehouse. Finished rooms stay with the ship.
