[entity-name]
tardis-circuit-input=TARDIS command socket
tardis-circuit-output=TARDIS telemetry and cargo

[entity-description]
tardis-circuit-input=Amber socket. Connect red or green wire from your combinators. Reads commands and emits nothing. A rising J signal requests one jump; P selects the planet and X/Y set coordinates.
tardis-circuit-output=Cyan socket. Outputs energy, ship status, command result and quality-aware cargo contents. Interior wiring travels with the ship; exterior wires disconnect when the ship leaves.

[item-group-name]
tardis-circuit-signals=TARDIS circuit network

[virtual-signal-name]
tardis-signal-jump=TARDIS J: jump command
tardis-signal-destination=TARDIS P: destination planet
tardis-signal-x=TARDIS X: landing coordinate
tardis-signal-y=TARDIS Y: landing coordinate
tardis-signal-inhibit=TARDIS H: flight interlock
tardis-signal-export=TARDIS G: power export
tardis-signal-energy=TARDIS E: energy in MJ
tardis-signal-charge=TARDIS Q: charge percentage
tardis-signal-busy=TARDIS B: in flight
tardis-signal-ready=TARDIS R: basic readiness
tardis-signal-origin=TARDIS O: current planet
tardis-signal-items=TARDIS I: cargo item count
tardis-signal-free-slots=TARDIS F: empty cargo slots
tardis-signal-result=TARDIS C: command result

[virtual-signal-description]
tardis-signal-jump=A 0-to-positive edge requests one jump. Hold positive and reset to zero for at least 0.5 seconds each. Failed commands are not automatically retried.
tardis-signal-destination=1 Nauvis; 2 Vulcanus; 3 Fulgora; 4 Gleba; 5 Aquilo; 6 Shattered Planet. Research and repairs are required.
tardis-signal-x=Landing X coordinate, defaults to zero. The ship searches for a nearby safe landing spot.
tardis-signal-y=Landing Y coordinate, defaults to zero. The ship searches for a nearby safe landing spot.
tardis-signal-inhibit=A positive signal blocks new flights. Does not abort a flight already in progress.
tardis-signal-export=Positive enables external power export, negative disables it. Zero leaves the last chosen state and returns control to the UI. Interior input wins conflicting commands.
tardis-signal-energy=Available shared energy, rounded down to MJ.
tardis-signal-charge=Current charge as a percentage of capacity, 0–100.
tardis-signal-busy=1 during dematerialisation and flight, otherwise 0.
tardis-signal-ready=1 when landed, console and Eye repaired, flight interlock clear and minimum energy available. A particular route may require more energy.
tardis-signal-origin=Current planet code using the P table. 0 for surfaces outside the standard navigation map.
tardis-signal-items=Total items in shared storage. Individual item signals include their quality.
tardis-signal-free-slots=Completely empty shared storage slots. Does not count space remaining in partial stacks.
tardis-signal-result=Last command: 0 none; 1 accepted; -1 rejected by repairs/energy/landing; -2 unknown or locked planet; -3 already flying; -4 flight interlock active.
