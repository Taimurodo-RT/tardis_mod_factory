plan-stabilizer-title=Spatial stabiliser
plan-stabilizer-description=Restore the ship to full integrity. Unlocks the final flight to the Shattered Planet and the return to the Doctor.
doctor-message=If you're hearing this, you've already met my TARDIS. Judging by the damage, it was a loud introduction. Mend the Eye of Harmony and the spatial stabiliser. Then find the Shattered Planet beyond the edge of this solar system: a trace of my timeline still clings on there. Send her along that trace. And please, step outside before you send her off. — The Doctor
doctor-message-damaged=The signal is damaged. Restore the control matrix to read the message.
already-returned=The TARDIS has already been returned to the Doctor.
need-console=First restore the control matrix in the "Restoration" tab.
need-eye=To fly, restore all four energy machines on the Eye of Harmony's lower deck.
already-flying=The TARDIS is already in flight.
quote-select-surface=Choose a planet surface.
quote-no-origin=Could not determine the planet of the last landing.
quote-no-route=There is no known space route between these planets.
