help-routes=Новые маршруты появляются после исследования планет. Отсчёт расстояния — от текущей посадки; 100 МДж на запуск и 1 кДж на километр.
help-routes-brief=Следуйте открытым мирам. Расход: 100 МДж + 1 кДж/км.
help-cargo-filter=Выберите предмет для точного фильтра по качеству. Щелчок: взять стак; Shift: взять всё доступное. Передача предметов доступна внутри Тардис.
help-cargo-filter-brief=Щелчок — стак. Shift — всё. Фильтр учитывает качество.
help-cargo-contents=Оборудование, качество, теги и порча сохраняются. Складские комнаты добавляют по 4096 ячеек — до 32 768. Ресурсы для строительства берутся отсюда.
help-cargo-contents-brief=Содержимое стека сохраняется. Складской модуль: +4096 ячеек.
help-reserve=Общий резерв — 10 ГДж. Контур удержания открывает ремонт коллекторов: каждый даёт 20 МВт, преобразователь после обоих добавляет 10 МВт. Для полёта нужны все четыре исправные энергомашины.
help-reserve-brief=Один резерв на весь корабль. Отдача Ока: 0 → 20 → 40 → 50 МВт.
help-power-socket=Подключите фабрику к энергетическому разъёму рядом с будкой. Выдача учитывает реальное потребление: подключение пустой сети не разряжает резерв. Разъём путешествует вместе с Тардис.
help-power-socket-brief=Разъёмы передают энергию по фактической нагрузке.
help-overload=При нагрузке выше выработки запас уменьшается. Если энергии не хватает на выбранный маршрут, ТАРДИС не взлетит. Отключите выдачу в сети или снизьте нагрузку завода и дождитесь заряда.
help-overload-brief=Перерасход истощает резерв. Для полёта нужен заряд на весь маршрут.
help-port-placement=Снаружи поставьте входной/выходной порт не дальше 8 клеток от будки; эти порты остаются на планете. Внутри порты работают во всех комнатах и во время полёта, снабжая мобильный завод из общего склада.
help-port-placement-brief=Внешние шлюзы: до 8 клеток от будки. Внутренние: на обеих палубах.
help-port-filters=Вход без фильтра принимает любые предметы. Выход без фильтра ничего не выдаёт. «Оставить» — неснижаемый запас выбранного предмета на складе. До 500 предметов за цикл, два цикла в секунду.
help-port-filters-brief=Вход принимает всё. Выходу нужен фильтр. Остаток защищает запас.
help-port-logistics=Вход — логистический сундук запроса, выход — пассивное снабжение. Запросы роботов настраиваются в обычном окне сундука; манипуляторы работают как обычно.
help-port-logistics-brief=Роботы и манипуляторы обслуживают шлюзы как обычные сундуки.
help-circuit=Отдельные вход и выход находятся по бокам будки и в грузовом отсеке. Подайте команды на вход, читайте состояние со выхода; не объединяйте их одним проводом. Грузовые порты подключают предметы к общей фабрике, сигнальные терминалы управляют кораблём.
help-circuit-brief=Янтарный терминал принимает команды. Голубой передаёт состояние.
help-restoration=При крушении корабль инженера врезался в ТАРДИС. Ремонтируйте узлы по порядку, снабжая общий склад через грузовые порты или вручную. Используются материалы обычного качества.
help-restoration-brief=След аварии сохранился в памяти корабля. Восстановите повреждённые системы.
help-eye-order=Сначала контур удержания, затем два коллектора в любом порядке, последним — преобразователь. Нужны исправная матрица и химическая наука. Частичная отдача заряжает резерв, но для полёта исправными должны быть все четыре машины.
help-eye-order-brief=Удержание → два коллектора → преобразователь. Ремонт — возле машины.
help-room-supply=Входные грузовые порты также снабжают строительство. Отменить можно формирование комнаты; готовые комнаты остаются частью корабля.
help-room-supply-brief=Материалы поступают из общего склада. Готовые комнаты остаются с кораблём.
