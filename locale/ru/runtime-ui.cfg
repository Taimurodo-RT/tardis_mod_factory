final-route-description=Это Разрушенная планета Space Age за границей солнечной системы. Её маршрут открывается исследованием прометиевой науки. После посадки полностью исправную ТАРДИС можно отправить по следу Доктора.
return-review=Подготовить возвращение Доктору
return-warning=ТАРДИС и Око Гармонии отправятся Доктору. Будет потрачено 1 ГДж. Экипаж вернётся на Наувис; комнаты, все машины и груз останутся доступны через постоянный пространственный якорь рядом с местом старта. Завод станет стационарным, полёты и генерация Ока прекратятся. Для дальнейшей работы завода понадобится собственный источник энергии.
