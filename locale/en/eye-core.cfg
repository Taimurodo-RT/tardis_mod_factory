[entity-description]
tardis-eye-machine=An Eye of Harmony extraction subsystem. Click to select it in the console. Repairs require a character within 6 tiles and normal-quality materials in the shared warehouse.
tardis-eye-hatch=Descend to the lower Eye of Harmony chamber. Approach within 4 tiles and click the hatch.
tardis-eye-ladder=Return to the central console room. Approach within 4 tiles and click the ladder.
tardis-eye-star=A contained star at the heart of the TARDIS. Repair its four surrounding energy machines separately to supply up to 50 MW to the shared reserve.
