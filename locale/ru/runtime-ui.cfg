room-refund=Освободите место в общем складе. Материалы сохранены и автоматически вернутся; отсек снова станет свободным.
room-route-legacy-north=Через восточный грузовой отсек пройдите по коридору на север. Координаты комнаты: __1__, __2__.
room-route-legacy-south=Через восточный грузовой отсек пройдите по коридору на юг. Координаты комнаты: __1__, __2__.
room-route-branch=Из круглого зала пройдите на север, затем через отсек __1__ к его ответвлению. Координаты комнаты: __2__, __3__.
