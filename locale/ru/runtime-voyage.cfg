[tardis-voyage]
plan-console-title=Матрица управления
plan-console-description=Починить повреждённую кораблём инженера консоль и восстановить сообщение Доктора.
plan-eye-title=Око Гармонии
plan-eye-description=Спуститесь через люк и восстановите четыре энергомашины у звезды. Выработка растёт по мере ремонта: 0 → 20 → 40 → 50 МВт.
plan-stabilizer-title=Пространственный стабилизатор
plan-stabilizer-description=Вернуть полную целостность кораблю. Открывает последний перелёт к Разрушенной планете и возвращение Доктору.
doctor-message=Если вы слышите это, вы уже познакомились с моей ТАРДИС. Судя по повреждениям, знакомство было громким. Почините Око Гармонии и пространственный стабилизатор. Затем отыщите Разрушенную планету за границей этой солнечной системы: там ещё держится след моей временной линии. Отправьте её по этому следу. И, пожалуйста, выйдите перед отправкой. — Доктор
doctor-message-damaged=Сигнал повреждён. Восстановите матрицу управления, чтобы прочитать сообщение.
already-returned=ТАРДИС уже возвращена Доктору.
need-console=Сначала восстановите матрицу управления во вкладке «Восстановление».
need-eye=Для полёта восстановите все четыре энергомашины нижнего зала Ока Гармонии.
already-flying=ТАРДИС уже в полёте.
quote-select-surface=Выберите поверхность планеты.
quote-no-origin=Не удалось определить планету последней посадки.
quote-no-route=Между планетами нет известного космического маршрута.
quote-not-unlocked=Планета ещё не открыта исследованиями вашей команды.
quote-need-stabilizer=Для полёта к Разрушенной планете восстановите пространственный стабилизатор.
quote-no-energy=Недостаточно энергии: нужно __1__ МДж. Отключите отдачу в сеть и дождитесь зарядки.
repair-unknown-node=Неизвестный узел корабля.
repair-finish-flight=Завершите перелёт перед ремонтом.
repair-already-done=Этот узел уже восстановлен.
repair-eye-on-site=Спуститесь через люк к Оку и ремонтируйте каждую энергомашину рядом с ней. Сводная починка с консоли недоступна.
repair-need-previous=Сначала восстановите предыдущий узел корабля.
repair-need-promethium-edge=Сначала исследуйте прометиевую науку и границу солнечной системы.
repair-need-chemical=Сначала исследуйте химическую науку.
repair-missing-materials=На складе недостаточно материалов обычного качества.
repair-inside-only=Восстановление доступно только изнутри своей ТАРДИС.
recovered-record-heading=[color=120,205,230]Восстановленная запись Доктора[/color]
repair-console-done=Матрица восстановлена. Сообщение Доктора расшифровано; теперь восстановите Око Гармонии.
repair-ship-done=Корабль полностью восстановлен. Последняя цель — Разрушенная планета за границей солнечной системы.
return-need-full-repair=Перед отправкой полностью восстановите ТАРДИС.
return-wait-landing=Дождитесь посадки.
return-need-shattered-planet=Отправка Доктору возможна только после посадки на Разрушенной планете.
return-need-promethium=Сначала исследуйте прометиевую науку.
return-need-energy=Для возвращения по временной линии нужен резерв 1 ГДж.
return-doctor-farewell=[color=120,205,230]Сообщение Доктора[/color]\nВот она. Моя невозможная девочка, снова дома. Спасибо, инженер. Берегите свою планету. И на этот раз смотрите, куда приземляетесь.\nИстория «Возвращение ТАРДИС» завершена.
return-done=ТАРДИС возвращена Доктору. История завершена.
stage-returned=Возвращена Доктору
stage-course-shattered=Курс на Разрушенную планету
stage-repair-stabilizer=Восстановить стабилизатор
stage-repair-eye=Восстановить Око Гармонии
stage-crashed=Повреждена при крушении
circuit-unknown-planet-code=Неизвестный код планеты: __1__.
circuit-planet-unavailable=Планета недоступна в этой партии.
circuit-planet-not-researched=Планета ещё не исследована.
circuit-jumps-inhibited=Прыжки заблокированы логической сетью.
